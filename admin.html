<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook Admin - Dashboard Riwayat Pesanan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-10">

  <!-- Header / Navbar Admin -->
  <header class="bg-teal-800 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛡️</span>
        <h1 class="text-lg font-bold">VetBook Admin Panel</h1>
      </div>
      <span id="admin-status" class="text-[9px] bg-emerald-500 text-white px-2.5 py-1 rounded-full font-bold">Live Dashboard</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Card Top Bar & Filter -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="font-bold text-gray-900 text-sm">📋 Riwayat Seluruh Pesanan</h2>
          <p class="text-[11px] text-gray-500">TeleVet, Layanan, & Digital Produk</p>
        </div>
        <button onclick="muatSemuaPesanan()" class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-teal-700 active:scale-95 transition-all flex items-center gap-1 shrink-0">
          🔄 Refresh
        </button>
      </div>

      <!-- Quick Filter Status -->
      <div class="flex gap-1.5 text-[10px] overflow-x-auto pb-1">
        <button onclick="filterStatus('semua')" class="bg-teal-800 text-white px-3 py-1 rounded-full font-bold shrink-0">Semua</button>
        <button onclick="filterStatus('Pending')" class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold shrink-0">Pending</button>
        <button onclick="filterStatus('Aktif')" class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold shrink-0">Aktif/Terkirim</button>
        <button onclick="filterStatus('Selesai')" class="bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-bold shrink-0">Selesai</button>
      </div>
    </div>

    <!-- Container Daftar Pesanan -->
    <div id="booking-list" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl text-center text-xs text-gray-400 border border-gray-200 shadow-sm">
        Memuat data transaksi dari Supabase...
      </div>
    </div>

  </main>

  <!-- Script Logika Admin -->
  <script>
    const SUPABASE_URL = "https://gobaqeeadobzpscqexax.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvYmFxZWVhZG9ienBzY3FleGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODY2ODEsImV4cCI6MjEwNTE2MjY4MX0.Usq9ECO3WQ4u7CXei7ylSBkefoMgFCL03qRwROMJs7U";

    let dbSupabase = null;
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      dbSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let rawBookingsData = [];

    window.addEventListener('DOMContentLoaded', () => {
      muatSemuaPesanan();
    });

    async function muatSemuaPesanan() {
      const container = document.getElementById('booking-list');

      // 1. Ambil data dari Supabase
      if (dbSupabase) {
        try {
          const { data, error } = await dbSupabase
            .from('bookings')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            rawBookingsData = data;
          }
        } catch (e) {
          console.error("Gagal koneksi Supabase Admin:", e);
        }
      }

      // 2. Gabungkan/Fallback dengan localStorage jika Supabase kosong
      if (rawBookingsData.length === 0) {
        rawBookingsData = JSON.parse(localStorage.getItem('vetbook_bookings') || '[]');
      }

      renderDaftarPesanan(rawBookingsData);
    }

    function filterStatus(status) {
      if (status === 'semua') {
        renderDaftarPesanan(rawBookingsData);
      } else {
        const filtered = rawBookingsData.filter(b => (b.status || 'Pending') === status);
        renderDaftarPesanan(filtered);
      }
    }

    function renderDaftarPesanan(daftarData) {
      const container = document.getElementById('booking-list');

      if (!daftarData || daftarData.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-2xl text-center text-xs text-gray-400 border border-gray-200 shadow-sm">
            Belum ada data pesanan tersimpan.
          </div>
        `;
        return;
      }

      let html = '';
      daftarData.forEach(item => {
        const isDigital = item.layanan && item.layanan.includes('Digital Produk');
        const isTeleVet = item.layanan && item.layanan.includes('TeleVet');
        const status = item.status || 'Pending';

        let statusBadge = '';
        if (status === 'Pending') {
          statusBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] px-2.5 py-0.5 rounded-full font-bold">⏳ Pending Verifikasi</span>`;
        } else if (status === 'Aktif') {
          statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2.5 py-0.5 rounded-full font-bold">✅ Terverifikasi / Aktif</span>`;
        } else {
          statusBadge = `<span class="bg-gray-100 text-gray-600 text-[10px] px-2.5 py-0.5 rounded-full font-bold">🏁 Selesai</span>`;
        }

        let tipeBadge = isDigital 
          ? `<span class="bg-purple-100 text-purple-800 text-[9px] px-2 py-0.5 rounded font-bold uppercase">Digital Product</span>`
          : `<span class="bg-teal-100 text-teal-800 text-[9px] px-2 py-0.5 rounded font-bold uppercase">Layanan / Konsultasi</span>`;

        const tgl = item.tanggal_booking || (item.created_at ? item.created_at.split('T')[0] : '-');

        // URL Room Chat Dokter
        const dokterChatUrl = `https://vetdigitalid.github.io/index.html?mode=chat&role=vet&name=drh.%20Najib&room=${item.booking_id}`;
        
        // Link Konsultasi Klien (untuk dikirim ke WhatsApp Klien)
        const klienChatUrl = `https://vetdigitalid.github.io/index.html?mode=chat&role=client&name=${encodeURIComponent(item.nama_pemilik || 'Klien')}&room=${item.booking_id}`;

        const pesanWA = `Halo Kak ${item.nama_pemilik}, pembayaran untuk pesanan *${item.layanan}* sudah kami verifikasi.%0A%0A` +
                        (isTeleVet ? `Silakan masuk ke Ruang Konsultasi TeleVet melalui link berikut:%0A${encodeURIComponent(klienChatUrl)}` : `Terima kasih telah berbelanja digital produk di VetBook!`);

        html += `
          <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <p class="text-[10px] font-mono text-gray-400">ID: ${item.booking_id || '-'}</p>
                <h3 class="font-bold text-gray-900 text-sm mt-0.5">${item.nama_pemilik || 'Klien'}</h3>
                <p class="text-xs text-teal-600 font-semibold">${item.layanan || '-'}</p>
              </div>
              <div class="text-right space-y-1">
                ${statusBadge}
                <div>${tipeBadge}</div>
              </div>
            </div>

            <div class="bg-gray-50 p-2.5 rounded-xl text-xs text-gray-600 space-y-1 border">
              <p>📱 <b>WhatsApp:</b> ${item.whatsapp || '-'}</p>
              <p>🐾 <b>Info / Catatan:</b> ${item.info_hewan || '-'}</p>
              <p>📅 <b>Tanggal:</b> ${tgl}</p>
            </div>

            <div class="flex flex-wrap gap-2 pt-1 border-t border-gray-100">
              <!-- Tombol Buka Chat Dokter -->
              ${isTeleVet ? `
                <a href="${dokterChatUrl}" target="_blank" class="bg-teal-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-teal-700 active:scale-95 transition-all flex items-center gap-1">
                  👨‍⚕️ Masuk Chat Dokter
                </a>
              ` : ''}

              <!-- Tombol Kirim WA -->
              <a href="https://wa.me/${item.whatsapp}?text=${pesanWA}" target="_blank" onclick="updateStatusPesanan('${item.booking_id}', 'Aktif')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-700 active:scale-95 transition-all flex items-center gap-1">
                📲 Kirim WA ${isTeleVet ? '& Access Link' : ''}
              </a>

              <!-- Tombol Selesaikan -->
              ${status !== 'Selesai' ? `
                <button onclick="updateStatusPesanan('${item.booking_id}', 'Selesai')" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-gray-300 active:scale-95 transition-all">
                  Tandai Selesai
                </button>
              ` : ''}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function updateStatusPesanan(bookingId, statusBaru) {
      // 1. Update ke Supabase
      if (dbSupabase) {
        try {
          await dbSupabase
            .from('bookings')
            .update({ status: statusBaru })
            .eq('booking_id', bookingId);
        } catch (e) {
          console.error("Gagal update status Supabase:", e);
        }
      }

      // 2. Update Local Storage
      let localData = JSON.parse(localStorage.getItem('vetbook_bookings') || '[]');
      let target = localData.find(b => b.booking_id === bookingId);
      if (target) {
        target.status = statusBaru;
        localStorage.setItem('vetbook_bookings', JSON.stringify(localData));
      }

      // 3. Muat ulang tampilan
      muatSemuaPesanan();
    }
  </script>
</body>
</html>
