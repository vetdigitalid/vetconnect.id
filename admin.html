<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VetBook - Daftar Pesanan & Konfirmasi Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-12">

  <!-- Header Admin -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🛡️ VetBook Admin Panel</h1>
      <span class="text-xs bg-teal-900 px-2.5 py-1 rounded-full">Live Dashboard</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div>
        <h2 class="text-md font-bold text-gray-900">Daftar Pesanan Masuk</h2>
        <p class="text-xs text-gray-500">Kelola konfirmasi pembayaran dan kirim link TeleVet.</p>
      </div>
      <button onclick="muatPesanan()" class="bg-teal-600 text-white text-xs px-3 py-2 rounded-lg font-semibold hover:bg-teal-700 transition-all">
        🔄 Refresh Data
      </button>
    </div>

    <!-- Container Daftar Pesanan -->
    <div id="daftar-pesanan" class="space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center text-gray-500 text-sm">
        Memuat data pesanan...
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://gobaqeeadobzpscqexax.supabase.co";
    const SUPABASE_KEY = "sb_publishable_u_79Qw9qcA_hhfTx01w2fA_Cu";
    
    let dbSupabase = null;
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      dbSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let pesananList = [];

    async function muatPesanan() {
      const container = document.getElementById('daftar-pesanan');
      container.innerHTML = '<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center text-gray-500 text-sm">Memuat data...</div>';

      // 1. Ambil dari LocalStorage terlebih dahulu
      let localData = JSON.parse(localStorage.getItem('vetbook_bookings') || '[]');

      // 2. Ambil dari Supabase jika ada
      if (dbSupabase) {
        try {
          const { data, error } = await dbSupabase.from('bookings').select('*').order('created_at', { ascending: false });
          if (data && data.length > 0) {
            localData = data;
          }
        } catch (err) {
          console.log('Menggunakan data lokal');
        }
      }

      pesananList = localData;
      renderPesanan();
    }

    function renderPesanan() {
      const container = document.getElementById('daftar-pesanan');
      container.innerHTML = '';

      if (pesananList.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center text-gray-500 text-sm">Belum ada pesanan masuk. Selesaikan order dari halaman utama terlebih dahulu.</div>';
        return;
      }

      pesananList.forEach((item, index) => {
        const isLunas = item.status === 'Lunas';
        const roomId = item.room_id || ('ROOM-' + Math.floor(100000 + Math.random() * 900000));
        item.room_id = roomId;

        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        const linkKlien = `${baseUrl}chat.html?room=${roomId}&role=client&name=${encodeURIComponent(item.nama_pemilik)}`;
        const linkVet = `${baseUrl}chat.html?room=${roomId}&role=vet&name=${encodeURIComponent(item.nama_pemilik)}`;

        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-200 space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start border-b pb-3">
            <div>
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${item.booking_id || item.id || 'BK-' + index}</span>
              <h3 class="font-bold text-gray-900 text-base">${item.nama_pemilik}</h3>
              <p class="text-xs text-teal-600 font-semibold">${item.layanan}</p>
            </div>
            <div>
              <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isLunas ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${item.status || 'Pending'}
              </span>
            </div>
          </div>

          <div class="text-xs space-y-1 text-gray-600">
            <p>📱 <b>No. WA:</b> ${item.whatsapp}</p>
            <p>📅 <b>Tanggal:</b> ${item.tanggal_booking}</p>
            <p>🐾 <b>Info/Keluhan:</b> ${item.info_hewan}</p>
          </div>

          <!-- Bagian Tombol Aksi -->
          <div class="pt-2 space-y-2">
            ${!isLunas ? `
              <button onclick="konfirmasiLunas(${index})" class="w-full bg-amber-600 text-white py-2.5 rounded-xl font-bold text-xs shadow hover:bg-amber-700 transition-all">
                ✅ Konfirmasi Pembayaran Lunas
              </button>
            ` : `
              <div class="bg-teal-50 border border-teal-200 p-3 rounded-xl space-y-2 text-xs">
                <p class="font-bold text-teal-900">✨ Pembayaran Lunas - Pilih Tujuan Kirim Link:</p>
                
                <button onclick="kirimWaKlien('${item.whatsapp}', '${item.nama_pemilik}', '${linkKlien}')" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold shadow hover:bg-emerald-700 transition-all flex items-center justify-center gap-1.5">
                  <span>📤 Kirim WA ke Klien (Link Ruang Chat)</span>
                </button>

                <button onclick="kirimWaVet('${item.nama_pemilik}', '${linkVet}')" class="w-full bg-teal-800 text-white py-2.5 rounded-xl font-bold shadow hover:bg-teal-900 transition-all flex items-center justify-center gap-1.5">
                  <span>🩺 Kirim WA ke Vet/Dokter</span>
                </button>
              </div>
            `}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function konfirmasiLunas(index) {
      pesananList[index].status = 'Lunas';
      
      // Update LocalStorage
      localStorage.setItem('vetbook_bookings', JSON.stringify(pesananList));

      // Update Database jika tersambung
      if (dbSupabase && pesananList[index].booking_id) {
        try {
          await dbSupabase.from('bookings').update({ status: 'Lunas' }).eq('booking_id', pesananList[index].booking_id);
        } catch (err) {
          console.log('Update database skipped');
        }
      }

      renderPesanan();
    }

    function kirimWaKlien(wa, nama, link) {
      const pesan = `Halo Kak *${nama}*, pembayaran TeleVet Anda telah dikonfirmasi *LUNAS* oleh Admin VetBook.%0A%0A` +
                    `Silakan klik tautan di bawah ini untuk masuk ke ruang konsultasi bersama drh. Najib:%0A` +
                    `${link}%0A%0A` +
                    `_(Catatan: Sesi konsultasi aktif dengan timer 20 menit). Terima kasih!_`;

      window.open(`https://wa.me/${wa}?text=${pesan}`, '_blank');
    }

    function kirimWaVet(nama, link) {
      const nomorVet = "6281215667746";
      const pesan = `Halo drh. Najib, pembayaran TeleVet untuk klien *${nama}* telah lunas.%0A%0A` +
                    `Silakan masuk ke ruang konsultasi sebagai Dokter melalui tautan berikut:%0A` +
                    `${link}%0A%0A` +
                    `_(Waktu konsultasi dokter tanpa batas waktu)._`;

      window.open(`https://wa.me/${nomorVet}?text=${pesan}`, '_blank');
    }

    muatPesanan();
  </script>
</body>
</html>
