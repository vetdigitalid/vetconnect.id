  <script>
    const SUPABASE_URL = "https://gobaqeeadobzpscqexax.supabase.co";
    const SUPABASE_KEY = "sb_publishable_u_79Qw9qcA_hhfTx01w2fA_Cu";
    
    let dbSupabase = null;
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
      dbSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let layananAktif = '';
    let selectedMedia = null;
    let countdownInterval = null;
    let vcInterval = null;
    let userRole = 'client';
    let currentRoomId = '';
    let currentUserName = '';

    // INISIALISASI HALAMAN & URL PARAMETER
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      const role = urlParams.get('role');
      const name = urlParams.get('name');
      const room = urlParams.get('room');

      if (mode === 'chat') {
        document.getElementById('view-main').classList.add('hidden');
        document.getElementById('view-chat').classList.remove('hidden');
        document.getElementById('page-tag').innerText = role === 'vet' ? 'Dokter Mode' : 'Klien Mode';

        userRole = role || 'client';
        currentRoomId = room || 'default-room';
        currentUserName = name ? decodeURIComponent(name) : 'Klien';

        if (userRole === 'vet') {
          document.getElementById('client-timer-box').classList.add('hidden');
          document.getElementById('vet-timer-box').classList.remove('hidden');
        } else {
          // Sinkronisasi Timer Klien menggunakan LocalStorage agar tidak reset saat refresh
          initClientTimer(20 * 60);
        }

        // Muat riwayat chat dari Supabase & aktifkan Realtime listener
        muatRiwayatChat();
        subscribeRealtimeChat();
      }
    });

    function pilihLayanan(nama, harga) {
      layananAktif = nama;
      document.getElementById('selected-service').value = `${nama} - Rp ${harga.toLocaleString('id-ID')}`;
      const formSection = document.getElementById('section-booking');
      formSection.classList.remove('hidden');
      formSection.scrollIntoView({ behavior: 'smooth' });
    }

    async function kirimKeAdmin() {
      const tanggal = document.getElementById('booking-date').value;
      const pemilik = document.getElementById('owner-name').value;
      const whatsapp = document.getElementById('owner-whatsapp').value;
      const hewan = document.getElementById('pet-info').value;

      if (!tanggal || !pemilik || !whatsapp || !hewan) {
        alert('Mohon lengkapi semua data pemesanan termasuk Nomor WhatsApp!');
        return;
      }

      let cleanWA = whatsapp.replace(/[^0-9]/g, '');
      if (cleanWA.startsWith('0')) cleanWA = '62' + cleanWA.substring(1);

      const bookingId = 'BK-' + Math.floor(100000 + Math.random() * 900000);
      const dataBaru = {
        booking_id: bookingId,
        nama_pemilik: pemilik, 
        whatsapp: cleanWA,
        info_hewan: hewan, 
        layanan: layananAktif, 
        tanggal_booking: tanggal,
        status: 'Pending',
        created_at: new Date().toISOString()
      };

      let localData = JSON.parse(localStorage.getItem('vetbook_bookings') || '[]');
      localData.unshift(dataBaru);
      localStorage.setItem('vetbook_bookings', JSON.stringify(localData));

      if (dbSupabase) {
        try { await dbSupabase.from('bookings').insert([dataBaru]); } catch (e) {}
      }

      const adminWA = "6281215667746";
      const pesanAdmin = `Halo Admin VetBook, saya ingin mengonfirmasi pembayaran pesanan:%0A%0A` +
                         `🆔 *ID:* ${bookingId}%0A` +
                         `📌 *Layanan:* ${encodeURIComponent(layananAktif)}%0A` +
                         `📅 *Tanggal:* ${encodeURIComponent(tanggal)}%0A` +
                         `👤 *Nama:* ${encodeURIComponent(pemilik)}%0A` +
                         `📱 *No. WA Klien:* ${encodeURIComponent(cleanWA)}%0A` +
                         `🐾 *Info Hewan:* ${encodeURIComponent(hewan)}%0A%0A` +
                         `💳 *Status:* Saya telah melakukan transfer pembayaran. Mohon verifikasi dan kirimkan link akses TeleVet. Terima kasih!`;

      window.open(`https://wa.me/${adminWA}?text=${pesanAdmin}`, '_blank');
    }

    // TIMER KLIEN PERSISTEN (TIDAK RESET SAAT REFRESH)
    function initClientTimer(durationSeconds) {
      const timerKey = `timer_${currentRoomId}`;
      let savedTime = localStorage.getItem(timerKey);
      let timeLeft = savedTime ? parseInt(savedTime) : durationSeconds;

      const display = document.getElementById('timer-display');

      countdownInterval = setInterval(() => {
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        display.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

        localStorage.setItem(timerKey, timeLeft);

        if (--timeLeft < 0) {
          clearInterval(countdownInterval);
          localStorage.removeItem(timerKey);
          akhiriSesi();
        }
      }, 1000);
    }

    function akhiriSesi() {
      if (countdownInterval) clearInterval(countdownInterval);
      localStorage.removeItem(`timer_${currentRoomId}`);
      document.getElementById('modal-expired').classList.remove('hidden');
    }

    // PENGELOLAAN MEDIA & PESAN CHAT
    function handleKeyPress(e) {
      if (e.key === 'Enter') kirimPesan();
    }

    function previewFile(event) {
      const file = event.target.files[0];
      if (file) {
        selectedMedia = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('img-preview').src = e.target.result;
          document.getElementById('media-preview').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function batalMedia() {
      selectedMedia = null;
      document.getElementById('media-input').value = '';
      document.getElementById('media-preview').classList.add('hidden');
    }

    async function kirimPesan() {
      const input = document.getElementById('input-pesan');
      const text = input.value.trim();

      if (!text && !selectedMedia) return;

      const pengirimNama = userRole === 'vet' ? 'drh. Najib' : currentUserName;
      let mediaUrl = null;

      if (selectedMedia) {
        mediaUrl = document.getElementById('img-preview').src; // Menggunakan Base64 string untuk preview instan
      }

      const pesanData = {
        room_id: currentRoomId,
        sender_role: userRole,
        sender_name: pengirimNama,
        message: text,
        media_url: mediaUrl,
        created_at: new Date().toISOString()
      };

      // Tampilkan secara lokal langsung (Optimistic UI)
      tambahPesanUI(pesanData);

      input.value = '';
      batalMedia();

      // Kirim ke Supabase Database agar diterima sisi lain
      if (dbSupabase) {
        try {
          await dbSupabase.from('messages').insert([pesanData]);
        } catch (err) {
          console.log('Gagal mengirim ke database online, tersimpan secara lokal.');
        }
      }
    }

    // MUAT RIWAYAT CHAT DARI SUPABASE
    async function muatRiwayatChat() {
      if (!dbSupabase) return;
      try {
        const { data, error } = await dbSupabase
          .from('messages')
          .select('*')
          .eq('room_id', currentRoomId)
          .order('created_at', { ascending: true });

        if (data && data.length > 0) {
          const container = document.getElementById('chat-messages');
          container.innerHTML = ''; // Bersihkan default
          data.forEach(msg => tambahPesanUI(msg));
        }
      } catch (err) {
        console.log('Gagal memuat riwayat chat');
      }
    }

    // REALTIME LISTENER SUPABASE (MENDENGARKAN PESAN MASUK OTOMATIS)
    function subscribeRealtimeChat() {
      if (!dbSupabase) return;
      
      dbSupabase
        .channel(`room-${currentRoomId}`)
        .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'messages',
          filter: `room_id=eq.${currentRoomId}` 
        }, payload => {
          const newMsg = payload.new;
          // Cek agar tidak duplikat dengan pesan yang dikirim sendiri
          if (newMsg.sender_role !== userRole) {
            tambahPesanUI(newMsg);
          }
        })
        .subscribe();
    }

    function tambahPesanUI(msg) {
      const container = document.getElementById('chat-messages');
      const isMe = msg.sender_role === userRole;
      
      const div = document.createElement('div');
      div.className = `p-3 rounded-2xl max-w-[85%] shadow-sm ${isMe ? 'bg-teal-600 text-white ml-auto rounded-tr-none' : 'bg-white text-gray-800 border rounded-tl-none'}`;
      
      let mediaContent = '';
      if (msg.media_url) {
        mediaContent = `<img src="${msg.media_url}" class="w-48 h-32 object-cover rounded-lg mb-1 border">`;
      }

      const time = new Date(msg.created_at || Date.now()).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `<p class="font-bold text-[10px] opacity-80 mb-0.5">${msg.sender_name}</p><div>${mediaContent}${msg.message ? `<p>${msg.message}</p>` : ''}</div><span class="text-[8px] opacity-70 block mt-1 text-right">${time}</span>`;

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // VIDEO CALL 3 MENIT
    function bukaVideoCall() {
      document.getElementById('modal-videocall').classList.remove('hidden');
      let seconds = 3 * 60;
      const display = document.getElementById('vc-timer');

      vcInterval = setInterval(() => {
        let m = Math.floor(seconds / 60);
        let s = seconds % 60;
        display.innerText = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

        if (--seconds < 0) {
          tutupVideoCall();
        }
      }, 1000);
    }

    function tutupVideoCall() {
      if (vcInterval) clearInterval(vcInterval);
      document.getElementById('modal-videocall').classList.add('hidden');
    }
  </script>
